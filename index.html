<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My_App: выберите свою версию</title>
  <meta name="description" content="My_App: приложения из вашего Apple ID на iPhone. Выберите версию: для уверенных пользователей или совсем простую.">
  <meta property="og:title" content="My_App: выберите свою версию">
  <meta property="og:image" content="https://zloyklaus.github.io/my-app-site/og-image.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="theme-color" content="#fff4d6">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #fff4d6; color: #2b2b2b; font-family: "Segoe UI", system-ui, Arial, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
    h1 { font-size: clamp(30px, 6vw, 52px); margin: 0 0 8px; }
    p.sub { font-size: clamp(17px, 3vw, 22px); margin: 0 0 40px; color: #5c5240; }
    .choices { display: flex; flex-wrap: wrap; gap: 32px 40px; justify-content: center; align-items: flex-end; }
    .choice { position: relative; padding-top: 150px; }
    .choice a.big { position: relative; z-index: 2; display: block; min-width: 280px; padding: 26px 34px; border-radius: 22px; background: #fff; color: #2b2b2b;
                    font-size: clamp(20px, 4vw, 28px); font-weight: 700; text-decoration: none; border: 4px solid #2b2b2b; box-shadow: 0 6px 0 #2b2b2b;
                    transition: transform .15s, box-shadow .15s; }
    .choice a.big:hover, .choice a.big:focus-visible { transform: translateY(3px); box-shadow: 0 3px 0 #2b2b2b; outline: none; }
    .choice small { display: block; font-weight: 400; font-size: 16px; color: #6b6150; margin-top: 6px; }
    .choice.easy a.big { background: #ffd84d; }
    /* собачка спрятана за кнопкой и выезжает вверх */
    .dog { position: absolute; left: 50%; bottom: 44px; width: 150px; margin-left: -75px; z-index: 1; transform: translateY(80px); opacity: 0;
           transition: transform .45s cubic-bezier(.2, 1.3, .4, 1), opacity .2s; pointer-events: none; }
    .choice.easy:hover .dog, .choice.easy:focus-within .dog, .choice.easy:active .dog { transform: translateY(0); opacity: 1; }
    @media (hover: none) { .choice.easy .dog { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dog, .choice a.big { transition: none; } }
  </style>
</head>
<body>
  <h1>Как вам удобнее?</h1>
  <p class="sub">Программа одна, версии сайта две. Выберите свою.</p>
  <div class="choices">
    <div class="choice pro">
      <a class="big" href="pro.html">Я уверенный пользователь<small>всё подробно, для опытных</small></a>
    </div>
    <div class="choice easy">
      <img class="dog" src="img/dog.png" alt="" width="150">
      <a class="big" href="prosto.html">Тут совсем просто<small>по шагам, без сложных слов</small></a>
    </div>
  </div>
</body>
</html>
